<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя веб-страница</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="hero">
            <h1 class="title">Добро пожаловать!</h1>
            <p class="subtitle">Это моя персональная веб-страница</p>
        </header>
        
        <main class="content">
            <section class="card">
                <h2>Обо мне</h2>
                <p>Привет! Это моя статическая веб-страница, размещенная на GitHub Pages.</p>
            </section>
            
            <section class="card">
                <h2>Контакты</h2>
                <div class="contact-info">
                    <p>📧 Email: ваш-email@example.com</p>
                    <p>📱 Телефон: +7 (XXX) XXX-XX-XX</p>
                </div>
            </section>
            
            <section class="card">
                <h2>Интерактивность</h2>
                <button id="theme-toggle" class="btn">Переключить тему</button>
                <button id="color-change" class="btn">Сменить цвет</button>
            </section>
        </main>
        
        <footer class="footer">
            <p>&copy; 2024 Моя веб-страница. Создано с ❤️</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
